[package]
name = "lifetrace-assets"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "A lightweight floating Dock and folder drawer for Windows"
license = "MIT"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "system-tray", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
