name: Flutter UI CI

on:
  push:
    branches:
      - main
      - feature/flutter-ui-v1
  pull_request:

concurrency:
  group: assets-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenSpec change
        run: npx --yes @fission-ai/openspec@1.13.0 validate implement-assets-v1 --strict --no-interactive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap platforms
        run: flutter create . --platforms=android,web --project-name lifetrace_assets
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded --timeout 60s
      - name: Build web preview
        run: flutter build web --release
