name: Publish Assets Release APK

on:
  workflow_run:
    workflows:
      - Flutter UI CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assets-release-apk
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release source
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi

          SHORT_SHA="${SHA:0:7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android platform
        run: flutter create . --platforms=android --project-name lifetrace_assets

      - name: Get dependencies
        run: flutter pub get

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          VERSION_NAME="${BASE_VERSION%%+*}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BUILD_NUMBER="${{ github.event.workflow_run.run_number }}"
          else
            BUILD_NUMBER="${{ github.run_number }}"
          fi

          VERSION="$VERSION_NAME+$BUILD_NUMBER"
          TAG="v$VERSION_NAME-build.$BUILD_NUMBER-${{ steps.source.outputs.short_sha }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >-
          flutter build apk --release
          --build-name "${{ steps.version.outputs.version_name }}"
          --build-number "${{ steps.version.outputs.build_number }}"

      - name: Stage APK
        shell: bash
        run: |
          APK_SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK_SOURCE"

          APK_NAME="LifeTrace-Assets-v${{ steps.version.outputs.version }}-${{ steps.source.outputs.short_sha }}.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Automated LifeTrace Assets Android APK built from main commit $TARGET_SHA.

          No custom keystore, signing password, or GitHub signing secrets are required. The generated Android project uses Flutter's default installable signing configuration for this release build.
          EOF

          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "LifeTrace Assets v$VERSION" \
            --notes-file release-notes.md \
            "$APK_NAME#LifeTrace Assets Android APK" \
            "$APK_NAME.sha256#SHA-256 checksum"
